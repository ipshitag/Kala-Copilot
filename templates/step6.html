{% extends "layout.html" %}
{% block content %}
<style>
  /* Fade-out Transition */
  .fade-out {
    opacity: 0;
    transition: opacity 0.4s ease;
  }

  /* Loader */
  .loader {
    display: none;
    text-align: center;
    margin-top: 20px;
  }

  .loader p {
    font-size: 1rem;
    font-weight: 600;
    color: #6f42c1;
    margin-top: 10px;
  }

  .loader span {
    display: inline-block;
    width: 24px;
    height: 24px;
    border: 3px solid #6f42c1;
    border-top: 3px solid transparent;
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }

  @keyframes spin {
    from {
      transform: rotate(0deg);
    }
    to {
      transform: rotate(360deg);
    }
  }

  /* General Styling for Buttons */
  .btn {
    border: none;
    border-radius: 8px;
    padding: 12px 20px;
    text-align: center;
    color: #fff;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: background-color 0.3s ease;
  }

  .btn-purple {
    background-color: #6f42c1;
  }

  .btn-purple:hover {
    background-color: #5a33a8;
  }

  /* Title */
  h2 {
    font-size: 1.75rem;
    text-align: center;
    margin-bottom: 20px;
    font-weight: 600;
    color: #333;
  }

  /* Paragraph Styling */
  p {
    font-size: 1rem;
    line-height: 1.6;
    color: #444;
    text-align: center;
  }

  /* Responsive Adjustments */
  @media (max-width: 768px) {
    h2 {
      font-size: 1.5rem;
    }
  }
</style>

<div class="container">
  <h2>Organized by the Cataloger Agent</h2>
  <h7>Your product gets neatly filed and tagged by the Cataloger Agent</h7>

  <!-- Display SEO Agent Results -->
  <!-- <p><strong>SEO Agent Result:</strong> {{ seo_agent_result }}</p> -->

  <!-- Generate Catalog Entry Button -->
  <div class="mt-3">
    <button id="btn-generate" class="btn btn-purple btn-lg w-100">Generate Catalog Entry</button>
  </div>

  <!-- Loader Section -->
  <div class="loader" id="loader">
    <span></span>
    <p>Generating Catalog Entry...</p>
  </div>

  <!-- Result Section -->
  <div id="result" class="mt-3"></div>

  <!-- Next Step / Finish Button -->
  <button id="btn-next" class="btn btn-purple btn-lg mt-3 w-100" style="display:none;" data-next-url="{{ url_for('final') }}">
    Finish
  </button>
</div>

<script>
  // Show Loader Animation
  function showLoader() {
    document.getElementById("loader").style.display = "block";
  }

  // Hide Loader Animation
  function hideLoader() {
    document.getElementById("loader").style.display = "none";
  }

  // Generate Catalog Entry Event Listener
  document.getElementById("btn-generate").addEventListener("click", () => {
    showLoader();
    fetch("/generate_catalog", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({})
    })
      .then(response => response.json())
      .then(data => {
        hideLoader();
        // Display Catalog Entry Result
        document.getElementById("result").innerHTML =
          `<p><strong>Catalog Entry:</strong> ${data.catalog_entry}</p>`;
        // Update Button and Show Finish
        document.getElementById("btn-generate").textContent = "Regenerate Catalog Entry";
        document.getElementById("btn-next").style.display = "block";
      })
      .catch(error => {
        hideLoader();
        document.getElementById("result").textContent = "Error: " + error;
      });
  });

  // Next Step with Fade-out Transition
  document.getElementById("btn-next").addEventListener("click", function() {
    const nextUrl = this.getAttribute("data-next-url");
    document.body.classList.add("fade-out");
    setTimeout(() => {
      window.location.href = nextUrl;
    }, 400);
  });
</script>
{% endblock %}
