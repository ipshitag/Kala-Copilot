{% extends "layout.html" %}
{% block content %}
<style>
  /* Fade-out for transitions */
  .fade-out {
    opacity: 0;
    transition: opacity 0.4s ease;
  }

  /* Loader */
  .loader {
    display: none;
    text-align: center;
    margin-top: 20px;
  }

  .loader p {
    font-size: 1rem;
    font-weight: 600;
    color: #6f42c1;
    margin-top: 10px;
  }

  .loader span {
    display: inline-block;
    width: 24px;
    height: 24px;
    border: 3px solid #6f42c1;
    border-top: 3px solid transparent;
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }

  @keyframes spin {
    from {
      transform: rotate(0deg);
    }
    to {
      transform: rotate(360deg);
    }
  }

  /* Button Styles */
  .btn {
    border: none;
    border-radius: 8px;
    padding: 12px 20px;
    text-align: center;
    color: #fff;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: background-color 0.3s ease;
  }

  .btn-purple {
    background-color: #6f42c1;
  }

  .btn-purple:hover {
    background-color: #5a33a8;
  }

  /* Title */
  h2 {
    font-size: 1.75rem;
    text-align: center;
    margin-bottom: 20px;
    font-weight: 600;
    color: #333;
  }

  p {
    font-size: 1rem;
    line-height: 1.6;
    color: #444;
    text-align: center;
  }

  textarea {
    border-radius: 8px;
    font-size: 1rem;
    padding: 10px;
    width: 100%;
    margin-top: 10px;
  }

  textarea:focus {
    outline: none;
    border-color: #6f42c1;
    box-shadow: 0 0 5px rgba(111, 66, 193, 0.5);
  }

  /* Responsive Adjustments */
  @media (max-width: 768px) {
    h2 {
      font-size: 1.5rem;
    }
  }
</style>

<div class="container">
  <h2>Step 4: SEO Agent</h2>
  
  <!-- Display Branding Agent Results -->
  <p><strong>Branding Agent Result:</strong> {{ branding_agent_result }}</p>

  <!-- Feedback Input Section -->
  <div class="mt-3">
    <textarea id="feedbackInput" class="form-control" rows="3" placeholder="Provide additional feedback (optional)"></textarea>
    <button id="btn-generate" class="btn btn-purple btn-lg w-100 mt-3">Generate SEO Copy</button>
  </div>

  <!-- Loader Section -->
  <div class="loader" id="loader">
    <span></span>
    <p>Generating SEO Copy...</p>
  </div>

  <!-- Result Section -->
  <div id="result" class="mt-3"></div>

  <!-- Next Step Button -->
  <button id="btn-next" class="btn btn-purple btn-lg mt-3 w-100" style="display:none;" data-next-url="{{ url_for('step5') }}">
    Next Step
  </button>
</div>

<script>
  // Show Loader Function
  function showLoader() {
    document.getElementById("loader").style.display = "block";
  }

  // Hide Loader Function
  function hideLoader() {
    document.getElementById("loader").style.display = "none";
  }

  // Event Listener for Generate SEO Copy
  document.getElementById("btn-generate").addEventListener("click", () => {
    const feedback = document.getElementById("feedbackInput").value; // Fetch feedback value
    showLoader();

    fetch("/generate_seo", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ feedback: feedback })
    })
      .then(response => response.json())
      .then(data => {
        hideLoader();
        // Display Result
        document.getElementById("result").innerHTML =
          `<p><strong>SEO Agent Result:</strong> ${data.seo_copy}</p>`;
        // Update Button States
        document.getElementById("btn-generate").textContent = "Regenerate SEO Copy";
        document.getElementById("btn-next").style.display = "block";
      })
      .catch(error => {
        hideLoader();
        document.getElementById("result").textContent = "Error: " + error;
      });
  });

  // Fade-out on Next Step
  document.getElementById("btn-next").addEventListener("click", function() {
    const nextUrl = this.getAttribute("data-next-url");
    document.body.classList.add("fade-out");
    setTimeout(function() {
      window.location.href = nextUrl;
    }, 400);
  });
</script>
{% endblock %}
