{% extends "layout.html" %}
{% block content %}
<style>
  .fade-out {
    opacity: 0;
    transition: opacity 0.4s ease;
  }
</style>
<h2>Step 2: Visual Insight Agent</h2>
<img src="{{ blob_url }}" style="max-height:200px" class="img-fluid d-block mx-auto mb-3" />

<div class="loader" id="loader" style="display:none;">
  <span></span>
  <p>Generating Insight...</p>
</div>
<div id="result" class="mt-3"></div>

<button id="btn-generate" class="btn btn-purple btn-lg w-100">Generate Visual Insight</button>
<button id="btn-next" class="btn btn-purple btn-lg mt-3 w-100"
        style="display:none;" data-next-url="{{ url_for('step3') }}">
  Next Step
</button>


<script>
  const imageDescription = "{{ imageDescription }}";
  function showLoader() {
    document.getElementById("loader").style.display = "block";
  }
  function hideLoader() {
    document.getElementById("loader").style.display = "none";
  }

  document.getElementById("btn-generate").addEventListener("click", () => {
    showLoader();
    fetch("/generate_insight", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            description: imageDescription
          })
        })
    .then(response => response.json())
    .then(data => {
      hideLoader();
      if (data.error) throw data.error;
      document.getElementById("result").innerHTML =
        "<p><strong>Description:</strong> " + data.visual_insight + "</p>";
      document.getElementById("btn-generate").style.display = "none";
      document.getElementById("btn-next").style.display = "block";
    })
    .catch(error => {
      hideLoader();
      document.getElementById("result").textContent = "Error: " + error;
    });
  });

  // Fade out on Next Step
  document.getElementById("btn-next").addEventListener("click", function() {
    const nextUrl = this.getAttribute("data-next-url");
    document.body.classList.add("fade-out");
    setTimeout(function() {
      window.location.href = nextUrl;
    }, 400);
  });
</script>
{% endblock %}
