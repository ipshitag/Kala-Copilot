{% extends "layout.html" %}
{% block content %}
<style>
  .step-container {
    max-width: 1200px;
    margin: 50px auto;
    padding: 20px;
    border-radius: 8px;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    background-color: #fff;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 40px; /* Add a gap between the two columns */
  }

  .image-container {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding-right: 20px;
    border-right: 1px solid #e4e4e4;
  }

  .image-container img {
    max-width: 100%;
    max-height: 400px;
    object-fit: contain;
    border-radius: 8px;
  }

  .description-container {
    padding-left: 20px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  h2 {
    font-size: 1.5rem;
    margin-bottom: 20px;
  }

  #result p {
    font-size: 1rem;
    line-height: 1.6;
  }

  #feedback-section textarea {
    resize: none;
  }

  .btn {
    border: none;
    border-radius: 8px;
    padding: 12px 20px;
    text-align: center;
    color: #fff;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: background-color 0.3s ease;
  }

  .btn-purple {
    background-color: #6f42c1;
  }

  .btn-purple:hover {
    background-color: #5a33a8;
  }

  .btn-primary {
    background-color: #007bff;
  }

  .btn-primary:hover {
    background-color: #0056b3;
  }

  .btn-secondary {
    color: #6c757d;
    background-color: #f8f9fa;
    border: 1px solid #e4e4e4;
  }

  .btn-secondary:hover {
    background-color: #e4e4e4;
  }

  .loader {
    display: none;
  }

  /* Responsive Adjustments */
  @media (max-width: 768px) {
    .step-container {
      grid-template-columns: 1fr;
      gap: 20px; /* Larger gap for smaller screens */
    }

    .image-container {
      border-right: none;
      padding-right: 0;
      padding-bottom: 20px;
      border-bottom: 1px solid #e4e4e4;
    }

    .description-container {
      padding-left: 0;
    }
  }
</style>

<div class="step-container">
  <!-- Image Section -->
  <div class="image-container">
    <h2>Step 1: Image Description</h2>
    <img src="{{ blob_url }}" alt="Uploaded image" />
    <a href="{{ url_for('upload') }}" class="btn btn-secondary mt-3">Upload a different image</a>
  </div>

  <!-- Description Section -->
  <div class="description-container">
    <div id="result">
      <!-- Placeholder for generated description -->
    </div>
    <!-- Loader -->
    <div class="loader" id="loader">
      <p>Generating description...</p>
    </div>
    <!-- Action Buttons -->
    <div>
      <button id="btn-generate" class="btn btn-purple w-100 mb-3">Generate Description</button>
      <div id="feedback-section" style="display:none;">
        <label for="additional-feedback" class="form-label">Any additional feedback?</label>
        <textarea id="additional-feedback" class="form-control mb-3" rows="3" placeholder="Your feedback here"></textarea>
        <button id="btn-regenerate" class="btn btn-purple w-100">Regenerate with Feedback</button>
      </div>
      <button id="btn-next" class="btn btn-purple w-100 mt-3" 
              data-next-url="{{ url_for('step2') }}" style="display:none;">
        Next Step
      </button>
    </div>
  </div>
</div>

<script>
  function showLoader() {
    document.getElementById("loader").style.display = "block";
  }

  function hideLoader() {
    document.getElementById("loader").style.display = "none";
  }

  document.getElementById("btn-generate").addEventListener("click", () => {
    generateDescription();
  });

  document.getElementById("btn-regenerate").addEventListener("click", () => {
    const feedback = document.getElementById("additional-feedback").value;
    generateDescription(feedback);
  });

  function generateDescription(feedback = '') {
    showLoader();
    fetch("/generate_description", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ 
        imageUrl: "{{ blob_url }}",
        feedback: feedback 
      })
    })
    .then(response => response.json())
    .then(data => {
      hideLoader();
      if (data.error) throw data.error;
      document.getElementById("result").innerHTML = `
        <p><strong>Description:</strong> ${data.description}</p>`;
      document.getElementById("btn-generate").style.display = "none";
      document.getElementById("feedback-section").style.display = "block";
      document.getElementById("btn-next").style.display = "block";
    })
    .catch(error => {
      hideLoader();
      document.getElementById("result").textContent = "Error: " + error;
    });
  }

  document.getElementById("btn-next").addEventListener("click", function() {
    const nextUrl = this.getAttribute("data-next-url");
    window.location.href = nextUrl;
  });
</script>
{% endblock %}
