{% extends "layout.html" %}
{% block content %}
<style>
  /* Fade-out Effect */
  .fade-out {
    opacity: 0;
    transition: opacity 0.4s ease;
  }

  /* Loader */
  .loader {
    display: none;
    text-align: center;
    margin-top: 20px;
  }

  .loader p {
    font-size: 1rem;
    font-weight: 600;
    color: #6f42c1;
    margin-top: 10px;
  }

  .loader span {
    display: inline-block;
    width: 24px;
    height: 24px;
    border: 3px solid #6f42c1;
    border-top: 3px solid transparent;
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }

  @keyframes spin {
    from {
      transform: rotate(0deg);
    }
    to {
      transform: rotate(360deg);
    }
  }

  /* Button Styles */
  .btn {
    border: none;
    border-radius: 8px;
    padding: 12px 20px;
    text-align: center;
    color: #fff;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: background-color 0.3s ease;
  }

  .btn-purple {
    background-color: #6f42c1;
  }

  .btn-purple:hover {
    background-color: #5a33a8;
  }

  /* Title */
  h2 {
    font-size: 1.75rem;
    text-align: center;
    margin-bottom: 20px;
    font-weight: 600;
    color: #333;
  }

  /* Responsive Adjustments */
  @media (max-width: 768px) {
    h2 {
      font-size: 1.5rem;
    }
  }

  /* Feedback Section */
  #feedbackForm {
    display: none; /* Initially hidden */
    margin-top: 20px;
  }

  textarea {
    border-radius: 8px;
    font-size: 1rem;
    padding: 10px;
  }

  textarea:focus {
    outline: none;
    border-color: #6f42c1;
    box-shadow: 0 0 5px rgba(111, 66, 193, 0.5);
  }
</style>

<div class="container">
  <h2>Step 3: Branding Agent</h2>

  <img src="{{ blob_url }}" style="max-height:200px" class="img-fluid d-block mx-auto mb-3" />

  <!-- Result Section -->
  <div id="result" class="mt-3"></div>

  <!-- Feedback Form for Regeneration -->
  <div id="feedbackForm" class="mt-3">
    <textarea id="feedbackInput" class="form-control" rows="3" placeholder="Provide additional feedback (optional)"></textarea>
    <button id="btn-regenerate" class="btn btn-purple btn-lg w-100 mt-3">Regenerate Branding with Feedback</button>
  </div>

  <!-- Buttons -->
  <button id="btn-generate" class="btn btn-purple btn-lg w-100 mt-3">Generate Branding</button>

  <!-- Loader -->
  <div class="loader" id="loader">
    <span></span>
    <p>Generating branding...</p>
  </div>

  <button id="btn-next" class="btn btn-purple btn-lg w-100 mt-3" style="display:none;" data-next-url="{{ url_for('step4') }}">
    Next Step
  </button>

  <div class="mt-2 text-center">
    <a href="{{ url_for('upload') }}" class="text-secondary">Upload a different image</a>
  </div>
</div>

<script>
  function showLoader() {
    document.getElementById("loader").style.display = "block";
  }

  function hideLoader() {
    document.getElementById("loader").style.display = "none";
  }

  document.getElementById("btn-generate").addEventListener("click", () => {
    generateOrRegenerateBranding(false); // Initial branding generation
  });

  document.getElementById("btn-regenerate").addEventListener("click", () => {
    generateOrRegenerateBranding(true); // Branding regeneration with feedback
  });

  function generateOrRegenerateBranding(isFeedback) {
    const feedback = isFeedback ? document.getElementById("feedbackInput").value : "";
    showLoader();
    fetch("/generate_branding", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ feedback: feedback, isFeedback: isFeedback })
    })
      .then(response => response.json())
      .then(data => {
        hideLoader();
        if (data.error) throw data.error;
        document.getElementById("result").innerHTML =
          `<p><strong>Branding:</strong> ${data.branding_copy}</p>`;
        if (!isFeedback) {
          document.getElementById("btn-generate").style.display = "none";
          document.getElementById("feedbackForm").style.display = "block";
          document.getElementById("btn-next").style.display = "block";
        }
      })
      .catch(error => {
        hideLoader();
        document.getElementById("result").textContent = "Error: " + error;
      });
  }

  // Fade-out effect for navigation
  document.getElementById("btn-next").addEventListener("click", function() {
    const nextUrl = this.getAttribute("data-next-url");
    document.body.classList.add("fade-out");
    setTimeout(function() {
      window.location.href = nextUrl;
    }, 400);
  });
</script>
{% endblock %}
